<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartwheel Trace Review</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1d1f; --muted: #6b6f76; --line: #e3e3df;
  --soft: #f0f0ec; --focus: #2f6fed;
  --user: #2563eb; --user-bg: #eef3fe;
  --reply: #15803d; --reply-bg: #eef8f1;
  --narr: #6d5f99; --narr-bg: #f4f2f9;
  --lookup: #b45309; --lookup-bg: #fdf6ec;
  --retr: #0f766e; --retr-bg: #ebf7f5;
  --write: #c2410c; --write-bg: #fdf0ea;
  --bad: #b91c1c; --bad-bg: #fdecec; --good: #15803d; --good-bg: #e8f6ec;
  --hl: #fde68a; --hl-line: #d4a106;
  --sugg: #a21caf; --sugg-bg: #fbeefd;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151618; --panel: #1d1f22; --ink: #e8e8e6; --muted: #9a9ea6; --line: #33363b;
    --soft: #25282c; --focus: #6d9bff;
    --user: #7aa5ff; --user-bg: #1b2433; --reply: #5fd08a; --reply-bg: #182a20;
    --narr: #b3a6e0; --narr-bg: #24212f; --lookup: #f0a54a; --lookup-bg: #2c2418;
    --retr: #4fd1c1; --retr-bg: #16292a; --write: #ff8a5b; --write-bg: #2e1f19;
    --bad: #ff7b7b; --bad-bg: #331c1c; --good: #5fd08a; --good-bg: #182a20;
    --hl: #6b5a12; --hl-line: #d4a106; --sugg: #e58af0; --sugg-bg: #2d1a30;
  }
}
:root[data-theme="dark"] {
  --bg: #151618; --panel: #1d1f22; --ink: #e8e8e6; --muted: #9a9ea6; --line: #33363b;
  --soft: #25282c; --focus: #6d9bff;
  --user: #7aa5ff; --user-bg: #1b2433; --reply: #5fd08a; --reply-bg: #182a20;
  --narr: #b3a6e0; --narr-bg: #24212f; --lookup: #f0a54a; --lookup-bg: #2c2418;
  --retr: #4fd1c1; --retr-bg: #16292a; --write: #ff8a5b; --write-bg: #2e1f19;
  --bad: #ff7b7b; --bad-bg: #331c1c; --good: #5fd08a; --good-bg: #182a20;
  --hl: #6b5a12; --hl-line: #d4a106; --sugg: #e58af0; --sugg-bg: #2d1a30;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--focus); border-color: var(--focus); color: #fff; }
input, select, textarea { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
code, pre { font-family: var(--mono); font-size: 12.5px; }
details > summary { cursor: pointer; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 10px; background: var(--soft); color: var(--muted); margin: 0 4px 2px 0; white-space: nowrap; }
.chip.warn { background: var(--bad-bg); color: var(--bad); }
.chip.ok { background: var(--good-bg); color: var(--good); }
.chip.batch { background: var(--user-bg); color: var(--user); }

/* top bar */
#top { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#top h1 { font-size: 15px; margin: 0; }
#tabs button { border: none; background: none; padding: 4px 10px; border-radius: 6px; color: var(--muted); }
#tabs button.on { background: var(--soft); color: var(--ink); font-weight: 600; }
#tabs .count { font-size: 11px; background: var(--sugg-bg); color: var(--sugg); border-radius: 8px; padding: 0 6px; margin-left: 4px; }
#counter { display: flex; gap: 10px; align-items: center; font-size: 12.5px; border-radius: 16px; padding: 3px 12px; background: var(--soft); border-color: var(--line); }
#counter b { font-size: 13px; }
#counter .k { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
#counter .bar { width: 60px; }
#counter { gap: 8px; }
@media (max-width: 1350px) { #counter .bar { display: none; } #top h1 { font-size: 14px; } #tabs button { padding: 4px 7px; } }
#source { margin-left: auto; font-size: 11.5px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
#top { column-gap: 12px; }
#counter { white-space: nowrap; }
#source.fallback { color: var(--bad); }

main { flex: 1; min-height: 0; display: flex; }
.view { display: none; flex: 1; min-height: 0; }
.view.on { display: flex; }

/* review view */
#sidebar { width: 280px; flex: none; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
#filters { padding: 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
#filters .row { display: flex; gap: 6px; }
#filters select, #filters input { width: 100%; min-width: 0; }
#session-list { overflow: auto; flex: 1; }
.srow { padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.srow:hover { background: var(--soft); }
.srow.on { background: var(--user-bg); }
.srow .l1 { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.srow .l2 { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; background: var(--line); }
.dot.done { background: var(--good); }
.dot.part { background: var(--hl-line); }
#list-foot { padding: 8px 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

#reader { flex: 1; overflow: auto; min-width: 0; }
#reader-inner { display: flex; gap: 20px; padding: 20px 24px 120px; max-width: 1160px; }
#content { flex: 1; max-width: 780px; min-width: 0; }
#margin { width: 260px; flex: none; position: relative; }
.empty { padding: 60px 24px; color: var(--muted); }

.shead { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 32px; }
.shead h2 { font-size: 16px; margin: 0 0 6px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.shead details { margin-top: 8px; font-size: 13px; }
.shead pre { white-space: pre-wrap; background: var(--soft); padding: 10px; border-radius: 6px; max-height: 420px; overflow: auto; }
.boiler { opacity: .55; }
.ctxblock { opacity: 1; background: var(--user-bg); display: inline; }
.expected { border-left: 3px solid var(--muted); padding-left: 10px; }

.turn { margin-bottom: 44px; }
.turn-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-bottom: 6px; border-bottom: 2px solid var(--line); margin-bottom: 10px; }
.turn-head b { color: var(--ink); font-size: 13px; }
.turn-head a { color: var(--focus); }
.turn.sampled > .turn-head { border-bottom-color: var(--user); }
.turn.current { outline: 2px solid var(--focus); outline-offset: 8px; border-radius: 4px; }

.seg { border-left: 3px solid; border-radius: 0 8px 8px 0; padding: 7px 12px; margin: 6px 0; }
.seg-label { font-size: 11px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; margin-bottom: 2px; }
.seg.user { border-color: var(--user); background: var(--user-bg); }
.seg.user .seg-label { color: var(--user); }
.seg.reply { border-color: var(--reply); background: var(--reply-bg); margin-top: 16px; }
.seg.reply .seg-label { color: var(--reply); }
.seg.narr { border-color: var(--narr); background: var(--narr-bg); font-style: italic; }
.seg.narr .seg-label { color: var(--narr); font-style: normal; }
.step { margin: 16px 0; }
.step .gen-meta { font-size: 11px; color: var(--muted); margin: 2px 0 0 15px; }
.tool { border: 1px solid var(--line); border-left: 3px solid; border-radius: 0 8px 8px 0; margin: 6px 0; background: var(--panel); }
.tool.lookup { border-left-color: var(--lookup); }
.tool.retrieval { border-left-color: var(--retr); }
.tool.write { border-left-color: var(--write); }
.tool-head { display: flex; align-items: center; gap: 8px; padding: 6px 12px; flex-wrap: wrap; }
.kind { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.lookup .kind { color: var(--lookup); background: var(--lookup-bg); }
.retrieval .kind { color: var(--retr); background: var(--retr-bg); }
.write .kind { color: var(--write); background: var(--write-bg); }
.tname { font-family: var(--mono); font-weight: 700; font-size: 13px; }
.targs { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.status { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; margin-left: auto; }
.status.ok { background: var(--good-bg); color: var(--good); }
.status.err { background: var(--bad-bg); color: var(--bad); }
.tool details { border-top: 1px solid var(--line); padding: 4px 12px; }
.tool details summary { font-size: 12px; color: var(--muted); }
.tool pre { white-space: pre-wrap; word-break: break-word; margin: 4px 0 6px; }
.reply-body p { margin: 0 0 8px; }
.reply-body ul { margin: 0 0 8px; padding-left: 20px; }
.annotatable { cursor: text; }
.after-first { opacity: .45; transition: opacity .15s; }
.after-first:hover { opacity: 1; }
.turn-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; font-size: 12px; }

.hl { background: var(--hl); border-bottom: 2px solid var(--hl-line); border-radius: 2px; }
.hl.ff { border-bottom-color: var(--bad); }
.hl.sugg { background: var(--sugg-bg); border-bottom: 2px dashed var(--sugg); }
.hl.pending { background: var(--hl); }
.hl.outline, .mnote.outline { outline: 2px solid var(--focus); }

.mnote { position: absolute; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--hl-line); border-radius: 0 8px 8px 0; padding: 6px 8px; font-size: 12.5px; }
.mnote.ff { border-left-color: var(--bad); }
.mnote.nofail { border-left-color: var(--good); }
.mnote.sugg { border: 1px dashed var(--sugg); border-left: 3px dashed var(--sugg); background: var(--sugg-bg); }
.mnote .tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
.mnote.sugg .tag { color: var(--sugg); }
.mnote .quote { color: var(--muted); font-style: italic; margin: 2px 0; }
.mnote .acts { display: flex; gap: 4px; margin-top: 4px; }
.mnote .acts button { padding: 0 6px; font-size: 11.5px; }
.mnote.human .acts { visibility: hidden; }
.mnote.human:hover .acts { visibility: visible; }
.mnote textarea { width: 100%; min-height: 60px; }

#popover { position: fixed; display: none; z-index: 20; width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
#popover textarea { width: 100%; min-height: 70px; }
#popover .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; }

/* generic panels */
.page { flex: 1; overflow: auto; padding: 20px 24px 80px; }
.page h2 { font-size: 16px; margin: 0 0 12px; }
.page h3 { font-size: 14px; margin: 24px 0 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12px; position: sticky; top: 0; background: var(--bg); }
a.link { color: var(--focus); cursor: pointer; text-decoration: none; }
a.link:hover { text-decoration: underline; }

/* taxonomy */
#treemap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.tm { border-radius: 8px; padding: 8px 10px; min-width: 180px; border: 1px solid var(--line); background: var(--panel); overflow: hidden; max-height: 260px; overflow-y: auto; }
.tm h4 { margin: 0 0 4px; font-size: 13px; font-family: var(--mono); }
.tm .n { font-size: 12px; color: var(--muted); }
.tm ul { margin: 4px 0 0; padding-left: 16px; font-size: 12px; }
.tm.final { border-color: var(--good); }
.tm.rejected { opacity: .55; }
.mode-form { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; align-items: start; }
.mode-form textarea { min-height: 54px; width: 100%; }
.mode-form input, .mode-form select { width: 100%; }
.code-row { display: grid; grid-template-columns: 1fr 220px; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.code-row .modes label { display: block; font-size: 12px; }

/* labels */
.lab-cell { white-space: nowrap; }
.lab-cell button { padding: 0 7px; font-size: 12px; }
.lab-cell button.on0 { background: var(--good-bg); color: var(--good); border-color: var(--good); font-weight: 700; }
.lab-cell button.on1 { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); font-weight: 700; }
.lab-cell .sync { font-size: 10px; margin-left: 3px; }
.lab-cell .ai { display: block; font-size: 11px; color: var(--sugg); }
tr.sel td { background: var(--user-bg); }
#label-focus { position: sticky; top: 0; z-index: 2; }

.bar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; min-width: 80px; }
.bar > span { display: block; height: 100%; background: var(--focus); }

#toast { position: fixed; bottom: 16px; right: 16px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: 13px; z-index: 50; }
#toast.on { opacity: .92; }

@media (max-width: 900px) {
  main { flex-direction: column; }
  #sidebar { width: 100%; max-height: 40vh; }
  #reader-inner { flex-direction: column; padding: 16px; }
  #margin { width: 100%; }
  .mnote { position: static; margin-bottom: 6px; }
  .code-row { grid-template-columns: 1fr; }
  .mode-form { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header id="top">
  <h1>Cartwheel trace review</h1>
  <nav id="tabs">
    <button data-view="review" class="on">Review</button>
    <button data-view="taxonomy">Taxonomy</button>
    <button data-view="labels">Labels</button>
    <button data-view="progress">Progress</button>
    <button data-view="suggestions">AI suggestions <span class="count" id="sugg-count">0</span></button>
  </nav>
  <button id="counter" title="Open the Progress tab"></button>
  <span id="source"></span>
</header>

<main>
  <section class="view on" id="view-review">
    <aside id="sidebar">
      <div id="filters">
        <input id="f-search" placeholder="Search id or text">
        <div class="row">
          <select id="f-scope" title="Show sessions containing sampled traces, or every session"><option value="sample">Sampled</option><option value="all">All</option></select>
          <select id="f-role"><option value="">Any role</option><option>shopper</option><option>merchant</option><option>support</option></select>
        </div>
        <div class="row">
          <select id="f-batch"><option value="">Any batch</option></select>
          <select id="f-status"><option value="">Any status</option><option value="open">Needs review</option><option value="done">Reviewed</option></select>
        </div>
      </div>
      <div id="session-list"></div>
      <div id="list-foot"></div>
    </aside>
    <div id="reader">
      <div id="reader-inner">
        <div id="content"><div class="empty">Loading traces…</div></div>
        <div id="margin"></div>
      </div>
    </div>
  </section>

  <section class="view" id="view-taxonomy"><div class="page" id="taxonomy-page"></div></section>
  <section class="view" id="view-labels"><div class="page" id="labels-page"></div></section>
  <section class="view" id="view-progress"><div class="page" id="progress-page"></div></section>
  <section class="view" id="view-suggestions"><div class="page" id="suggestions-page"></div></section>
</main>

<div id="popover">
  <div class="small muted" id="pop-quote"></div>
  <textarea id="pop-note" placeholder="Describe what went wrong, in your own words (Enter saves, Shift+Enter for a new line, Esc cancels)"></textarea>
  <div class="row">
    <label><input type="checkbox" id="pop-ff"> First failure in this trace</label>
    <span><button id="pop-cancel">Cancel</button> <button class="primary" id="pop-save">Save</button></span>
  </div>
</div>
<div id="toast"></div>

<script>
/* ------------------------------------------------------------------ *
 * state and API                                                        *
 * ------------------------------------------------------------------ */
const S = {
  meta: {}, sessions: [], manifest: {batches: {}, items: []}, annotations: [],
  patterns: {modes: []}, suggestions: [], labels: {},
  traceIndex: {}, sessionIndex: {}, sampleIndex: {},
  view: 'review', sid: null, tid: null, showCandidates: false, labelSel: null,
  editing: null, serverSnap: {},
};
const api = {
  async get(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); },
  async post(p, body) {
    const r = await fetch(p, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok || data.ok === false) throw new Error(data.error || (p + ' ' + r.status));
    return data;
  },
};
const $ = (id) => document.getElementById(id);
const nowIso = () => new Date().toISOString();
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function pretty(v) { if (typeof v === 'string') return v; try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); } }
function short(id) { return String(id || '').slice(0, 8); }
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
/* Small markdown subset used by Cartwheel replies: paragraphs, bullets, bold. */
function md(text) {
  const out = []; let list = null;
  String(text || '').split('\n').forEach(line => {
    const m = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
    if (m) { if (!list) { list = []; } list.push('<li>' + inline(m[1]) + '</li>'); return; }
    if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; }
    const h = line.match(/^#{1,6}\s+(.*)$/);
    if (h) out.push('<p><strong>' + inline(h[1]) + '</strong></p>');
    else if (line.trim()) out.push('<p>' + inline(line) + '</p>');
  });
  if (list) out.push('<ul>' + list.join('') + '</ul>');
  return out.join('');
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600);
}
function backup() {
  try { localStorage.setItem('cartwheel_hw4_annotations', JSON.stringify(S.annotations)); } catch (e) { /* storage may be blocked */ }
}

/* ------------------------------------------------------------------ *
 * loading and derived indexes                                          *
 * ------------------------------------------------------------------ */
async function loadAll() {
  const [meta, sessions, manifest, ann, patterns, sugg, labels] = await Promise.all([
    api.get('/api/meta'), api.get('/api/sessions'), api.get('/api/manifest'),
    api.get('/api/annotations'), api.get('/api/patterns'), api.get('/api/suggestions'), api.get('/api/labels'),
  ]);
  S.meta = meta; S.sessions = sessions;
  S.manifest = manifest; S.annotations = ann.annotations || [];
  S.patterns = patterns.modes ? patterns : {modes: []};
  S.suggestions = Array.isArray(sugg) ? sugg : []; S.labels = labels;
  S.serverSnap = {manifest: JSON.stringify(manifest), patterns: JSON.stringify(patterns), suggestions: JSON.stringify(sugg)};
  reindex();
}
function reindex() {
  S.traceIndex = {}; S.sessionIndex = {}; S.sampleIndex = {};
  S.sessions.forEach(s => {
    S.sessionIndex[s.session_id] = s;
    s.turns.forEach(t => { S.traceIndex[t.trace_id] = {session: s, turn: t}; });
  });
  (S.manifest.items || []).forEach(it => { S.sampleIndex[it.trace_id] = it; });
}
function traceStatus(tid) {
  const anns = S.annotations.filter(a => a.trace_id === tid);
  if (anns.some(a => a.kind === 'no_failure' || a.first_failure)) return 'done';
  return anns.length ? 'part' : 'none';
}
function modesFor(includeCandidates) {
  return (S.patterns.modes || []).filter(m => m.status === 'final' || (includeCandidates && m.status === 'candidate'));
}
function sessionTraces(s, scope) {
  return scope === 'sample' ? s.turns.filter(t => S.sampleIndex[t.trace_id]) : s.turns;
}

/* ------------------------------------------------------------------ *
 * review: session list                                                 *
 * ------------------------------------------------------------------ */
function renderBatchFilter() {
  const sel = $('f-batch'); const cur = sel.value;
  sel.innerHTML = '<option value="">Any batch</option>' +
    Object.keys(S.manifest.batches || {}).map(b => `<option value="${esc(b)}">${esc(b)}</option>`).join('') +
    (S.annotations.some(a => a.batch === 'part_a') ? '<option value="__part_a">Part A (pre-batch)</option>' : '');
  sel.value = cur;
}
function filteredSessions() {
  const q = $('f-search').value.trim().toLowerCase();
  const scope = $('f-scope').value, role = $('f-role').value, batch = $('f-batch').value, status = $('f-status').value;
  const partA = new Set(S.annotations.filter(a => a.batch === 'part_a').map(a => a.trace_id));
  return S.sessions.filter(s => {
    const traces = batch === '__part_a' ? s.turns.filter(t => partA.has(t.trace_id)) : sessionTraces(s, scope);
    if (!traces.length) return false;
    if (role && s.role !== role) return false;
    if (batch && batch !== '__part_a' && !s.turns.some(t => (S.sampleIndex[t.trace_id] || {}).batch === batch)) return false;
    if (status) {
      const done = traces.every(t => traceStatus(t.trace_id) === 'done');
      if (status === 'done' ? !done : done) return false;
    }
    if (q) {
      const hay = [s.session_id, s.scenario_id, ...s.turns.flatMap(t => [t.trace_id, t.user, t.reply])].join(' ').toLowerCase();

let pending = null; // {spans, ctx}
$('content').addEventListener('mouseup', () => {

    seg: ctx.seg, start: ctx.start, quote: ctx.quote, note, first_failure: ff,
    created_at: nowIso(), updated_at: nowIso(), history: [],
  });
  closePopover();
  await saveAnnotations();
  renderSession(); renderSessionList();
}
async function markNoFailure(tid) {
  if (S.annotations.some(a => a.trace_id === tid && a.first_failure)) {
    if (!confirm('This trace already has a first-failure note. Replace it with "no failure observed"? The note is kept, but no longer marked as the first failure.')) return;
    S.annotations.forEach(a => { if (a.trace_id === tid && a.first_failure) { a.first_failure = false; a.updated_at = nowIso(); } });
  }
  S.annotations.push({id: newId('a'), kind: 'no_failure', source: 'human', trace_id: tid, session_id: sessionOf(tid),
    note: 'no failure observed', first_failure: false, created_at: nowIso(), updated_at: nowIso(), history: []});
  await saveAnnotations(); renderSession(); renderSessionList();
}
async function saveEdit(id) {
  const a = S.annotations.find(x => x.id === id); if (!a) return;
  const note = $('edit-note').value.trim(), ff = $('edit-ff').checked;
  if (!note) return toast('A note cannot be empty; delete it instead.');
  if (note !== a.note || ff !== !!a.first_failure) {
    // Keep the original wording: the path from open code to category must stay inspectable.
    a.history = a.history || [];
    a.history.push({note: a.note, first_failure: !!a.first_failure, at: a.updated_at || a.created_at});
    if (ff) S.annotations.forEach(o => { if (o.trace_id === a.trace_id && o.id !== id) o.first_failure = false; });
    a.note = note; a.first_failure = ff; a.updated_at = nowIso();
  }
  S.editing = null; await saveAnnotations(); renderSession();
}
async function deleteAnnotation(id) {
  const a = S.annotations.find(x => x.id === id);
  const linked = (S.patterns.modes || []).filter(m => (m.annotation_ids || []).includes(id));
  if (linked.length && !confirm(`This note supports ${linked.map(m => m.name).join(', ')}. Delete it anyway?`)) return;
  if (a && a.kind !== 'no_failure' && !linked.length && !confirm('Delete this note?')) return;
  S.annotations = S.annotations.filter(x => x.id !== id);
  await saveAnnotations(); renderSession(); renderSessionList();
}
async function saveAnnotations() {
  backup();
  renderCounter();
  try { await api.post('/api/annotations', {annotations: S.annotations}); }
  catch (e) { toast('Save failed, kept in this browser: ' + e.message); }
}

/* ------------------------------------------------------------------ *
 * suggestions                                                          *
 * ------------------------------------------------------------------ */
async function decideSuggestions(ids, accept) {
  let reason = '';
  if (!accept) {
    reason = prompt(`Why reject ${ids.length > 1 ? 'these ' + ids.length + ' suggestions' : 'this suggestion'}? (recorded with the decision)`) || '';
    if (!reason.trim()) return toast('Rejection needs a reason, so the boundary is recorded.');
  }
  const failures = [];
  for (const id of ids) {
    const sg = S.suggestions.find(x => x.id === id);
    if (!sg || sg.status !== 'pending') continue;
    try {
      if (accept && sg.kind === 'no_failure') {
        if (S.annotations.some(a => a.trace_id === sg.trace_id && a.first_failure)) throw new Error('this trace already has a first-failure note');
        if (!S.annotations.some(a => a.trace_id === sg.trace_id && a.kind === 'no_failure')) {
          S.annotations.push({id: newId('a'), kind: 'no_failure', source: 'ai_accepted', suggestion_id: sg.id, trace_id: sg.trace_id,
            session_id: sessionOf(sg.trace_id), note: sg.note || 'no failure observed', first_failure: false,
            created_at: nowIso(), updated_at: nowIso(), history: []});
        }
      } else if (accept && sg.kind === 'label') {
        await api.post('/api/labels', {mode: sg.mode, trace_id: sg.trace_id, label: sg.label, evidence: sg.evidence || sg.rationale,
          source: 'ai_accepted', suggestion_id: sg.id, session_id: sessionOf(sg.trace_id)});
      } else if (accept) {
        const ff = !!sg.first_failure;
        if (ff) {
          S.annotations.forEach(a => { if (a.trace_id === sg.trace_id && a.first_failure) { a.first_failure = false; a.updated_at = nowIso(); } });
          // A failure note replaces an earlier "no failure observed" mark, as when writing a note by hand.
          S.annotations = S.annotations.filter(a => !(a.trace_id === sg.trace_id && a.kind === 'no_failure'));
        }
        S.annotations.push({id: newId('a'), kind: 'note', source: 'ai_accepted', suggestion_id: sg.id, trace_id: sg.trace_id,
          session_id: sessionOf(sg.trace_id), seg: sg.seg, start: sg.start, quote: sg.quote, note: sg.note || '',
          first_failure: ff, requirement: sg.requirement, created_at: nowIso(), updated_at: nowIso(), history: []});
        if (sg.mode) {
          const mode = (S.patterns.modes || []).find(m => m.name === sg.mode);
          if (mode) { mode.annotation_ids = mode.annotation_ids || []; mode.annotation_ids.push(S.annotations[S.annotations.length - 1].id); }
        }
      }
      sg.status = accept ? 'accepted' : 'rejected';
      sg.decided_at = nowIso(); sg.decision_reason = reason || null;
    } catch (e) { failures.push(id + ': ' + e.message); }
  }
  await saveAnnotations();
  await api.post('/api/suggestions', S.suggestions);
  await api.post('/api/patterns', S.patterns);
  S.serverSnap.suggestions = JSON.stringify(S.suggestions); S.serverSnap.patterns = JSON.stringify(S.patterns);
  S.labels = await api.get('/api/labels');
  if (failures.length) toast('Some decisions failed: ' + failures[0]);
  else toast(`${ids.length} suggestion${ids.length > 1 ? 's' : ''} ${accept ? 'accepted' : 'rejected'}`);
  renderAll();
}
function renderSuggestions() {
  const pendingList = S.suggestions.filter(x => x.status === 'pending');
  const decided = S.suggestions.filter(x => x.status !== 'pending');
  $('sugg-count').textContent = pendingList.length;
  const row = (x, check) => {
    const hit = S.traceIndex[x.trace_id];
    const what = x.kind === 'label' ? `${esc(x.mode)} = <b>${x.label === 1 ? 'present' : 'absent'}</b>`
      : x.kind === 'no_failure' ? '<b>no failure observed</b>'
      : `${x.first_failure ? '<b>first failure</b> note' : 'note'}${x.mode ? ' → ' + esc(x.mode) : ''}`;
    return `<tr>
      ${check ? `<td><input type="checkbox" class="sg-check" value="${esc(x.id)}"></td>` : `<td><span class="chip ${x.status === 'accepted' ? 'ok' : 'warn'}">${esc(x.status)}</span></td>`}
      <td>${what}<div class="small muted">${esc(x.source || 'agent')}${x.search ? ' · search: ' + esc(x.search) : ''}</div></td>
      <td>${x.quote ? `<a class="link" data-goto="${esc(x.trace_id)}">“${esc(clip(x.quote, 100))}”</a>` : `<a class="link" data-goto="${esc(x.trace_id)}">trace ${short(x.trace_id)}</a>`}
        ${hit ? `<div class="small muted">${esc(hit.session.scenario_id || '')} turn ${hit.turn.turn}</div>` : ''}</td>
      <td>${esc(x.note || '')}<div class="small muted">${esc(x.rationale || '')}</div></td>
      ${check ? '' : `<td class="small">${esc(x.decision_reason || '')}<div class="muted">${esc((x.decided_at || '').slice(0, 16))}</div></td>`}
    </tr>`;
  };
  $('suggestions-page').innerHTML = `
    <h2>AI suggestions</h2>
    <p class="muted small">Suggestions from the coding agent, Workshop, or similarity searches. They are hypotheses: nothing here counts as a note or label until you accept it. Every rejection keeps its reason.</p>
    <div class="card">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <label><input type="checkbox" id="sg-all"> Select all</label>
        <button class="primary" id="sg-accept">Accept selected</button>
        <button id="sg-reject">Reject selected</button>
        <span class="muted small">${pendingList.length} pending</span>
      </div>
      <table><thead><tr><th></th><th>Suggestion</th><th>Evidence</th><th>Note / rationale</th></tr></thead>
      <tbody>${pendingList.map(x => row(x, true)).join('') || '<tr><td colspan="4" class="muted">No pending suggestions.</td></tr>'}</tbody></table>
    </div>
    <h3>Decided (${decided.length})</h3>
    <div class="card"><table><thead><tr><th>Decision</th><th>Suggestion</th><th>Evidence</th><th>Note / rationale</th><th>Reason</th></tr></thead>
      <tbody>${decided.map(x => row(x, false)).join('') || '<tr><td colspan="5" class="muted">None yet. The handout requires at least one rejected suggestion.</td></tr>'}</tbody></table></div>`;
  const page = $('suggestions-page');
  page.querySelectorAll('[data-goto]').forEach(a => a.onclick = () => gotoTrace(a.dataset.goto));
  $('sg-all').onchange = e => page.querySelectorAll('.sg-check').forEach(c => { c.checked = e.target.checked; });
  const chosen = () => [...page.querySelectorAll('.sg-check:checked')].map(c => c.value);
  $('sg-accept').onclick = () => { const ids = chosen(); if (ids.length) decideSuggestions(ids, true); };
  $('sg-reject').onclick = () => { const ids = chosen(); if (ids.length) decideSuggestions(ids, false); };
}

/* ------------------------------------------------------------------ *
 * taxonomy                                                             *
 * ------------------------------------------------------------------ */
const MODE_FIELDS = [
  ['name', 'Name (snake_case)', 'input'],
  ['status', 'Status', 'select', ['candidate', 'final', 'rejected']],
  ['definition', 'Binary definition', 'textarea'],
  ['boundary', 'Boundary vs nearest mode', 'textarea'],
  ['nearest_mode', 'Nearest mode', 'input'],
  ['spec_ref', 'Requirement (SPEC.md id or revision)', 'input'],
  ['evaluator', 'Likely evaluator', 'select', ['', 'code check', 'LLM judge']],
  ['product_change', 'Product change that fixes it', 'textarea'],
];
function noteLabel(a) {
  const hit = S.traceIndex[a.trace_id];
  return `${hit ? esc(hit.session.scenario_id || '') + ' t' + hit.turn.turn : short(a.trace_id)}`;
}
function renderTaxonomy() {
  const modes = S.patterns.modes || [];
  const notes = S.annotations.filter(a => a.kind === 'note');
  const assigned = new Set(modes.filter(m => m.status !== 'rejected').flatMap(m => m.annotation_ids || []));
  const unassigned = notes.filter(a => !assigned.has(a.id));
  const blocks = modes.map(m => ({m, ids: (m.annotation_ids || []).filter(id => notes.some(a => a.id === id))}));
  const max = Math.max(1, ...blocks.map(b => b.ids.length), unassigned.length);
  const block = (title, cls, ids, sub) => `<div class="tm ${cls}" style="flex:${1 + ids.length} 1 ${Math.round(180 + 220 * ids.length / max)}px">
      <h4>${esc(title)}</h4><div class="n">${ids.length} note${ids.length === 1 ? '' : 's'}${sub ? ' · ' + sub : ''}</div>
      <ul>${ids.map(id => { const a = notes.find(x => x.id === id); return `<li><a class="link" data-goto-ann="${id}">${esc(clip(a.note, 90))}</a> <span class="muted">${noteLabel(a)}</span></li>`; }).join('')}</ul></div>`;
  let html = `<h2>Taxonomy</h2>
    <p class="muted small">Modes are built from your open codes. Each block is sized by its supporting notes; click a note to see it in its trace. Rejected groups stay listed so the revision history is visible.</p>
    <div id="treemap">${blocks.map(b => block(b.m.name, b.m.status, b.ids, b.m.status)).join('')}
      ${block('unassigned open codes', '', unassigned.map(a => a.id), 'not yet grouped')}</div>
    <div style="display:flex;gap:8px;margin-bottom:12px"><button class="primary" id="new-mode">New mode</button></div>`;
  html += modes.map((m, i) => `<div class="card"><div class="mode-form" data-mode="${i}">
      ${MODE_FIELDS.map(([k, label, type, opts]) => `<label class="small muted">${label}</label>` + (
        type === 'textarea' ? `<textarea data-k="${k}">${esc(m[k] || '')}</textarea>` :
        type === 'select' ? `<select data-k="${k}">${opts.map(o => `<option ${m[k] === o ? 'selected' : ''} value="${o}">${o || '—'}</option>`).join('')}</select>` :
        `<input data-k="${k}" value="${esc(m[k] || '')}">`)).join('')}
      <label class="small muted">Positive traces</label><input data-k="positives" value="${esc((m.positives || []).join(' '))}" placeholder="trace ids, space separated">
      <label class="small muted">Close negatives</label><input data-k="close_negatives" value="${esc((m.close_negatives || []).join(' '))}" placeholder="trace ids, space separated">
      <label class="small muted">Revision note</label><input data-k="_revnote" placeholder="why you changed it (saved with the revision)">
      <span></span><span><button data-save-mode="${i}">Save mode</button>
        <span class="small muted">${(m.revisions || []).length} revision${(m.revisions || []).length === 1 ? '' : 's'} recorded</span></span>
    </div>
    ${(m.revisions || []).length ? `<details class="small"><summary>Revision history</summary><ul>${m.revisions.map(r => `<li>${esc((r.at || '').slice(0, 16))}: ${esc(r.note || '')} <span class="muted">${esc(Object.keys(r.changes || {}).join(', '))}</span></li>`).join('')}</ul></details>` : ''}
  </div>`).join('');
  html += `<h3>Open codes (${notes.length})</h3>
    <p class="muted small">Assign each note to the candidate modes it supports (axial coding). The note text is never changed here.</p>
    <div class="card">${notes.map(a => `<div class="code-row">
      <div><a class="link" data-goto-ann="${a.id}">${esc(a.note)}</a>
        <div class="small muted">${noteLabel(a)}${a.first_failure ? ' · first failure' : ''}${a.quote ? ' · “' + esc(clip(a.quote, 70)) + '”' : ''}</div></div>
      <div class="modes">${modes.filter(m => m.status !== 'rejected').map(m => `<label><input type="checkbox" data-assign="${esc(a.id)}" data-mode-name="${esc(m.name)}" ${(m.annotation_ids || []).includes(a.id) ? 'checked' : ''}> ${esc(m.name)}</label>`).join('') || '<span class="muted small">create a mode first</span>'}</div>
    </div>`).join('') || '<span class="muted">No notes yet.</span>'}</div>`;
  const page = $('taxonomy-page'); page.innerHTML = html;
  page.querySelectorAll('[data-goto-ann]').forEach(el => el.onclick = () => {
    const a = S.annotations.find(x => x.id === el.dataset.gotoAnn); if (a) gotoTrace(a.trace_id);
  });
  $('new-mode').onclick = () => {
    const name = (prompt('Mode name (snake_case, describing the observed failure):') || '').trim();
    if (!name) return;
    if (!/^[a-z][a-z0-9_]{1,63}$/.test(name)) return toast('Use snake_case: lowercase letters, digits, underscores.');
    if (modes.some(m => m.name === name)) return toast('A mode with that name exists.');
    S.patterns.modes = modes.concat([{name, status: 'candidate', definition: '', boundary: '', annotation_ids: [], positives: [], close_negatives: [], revisions: [{at: nowIso(), note: 'created', changes: {}}]}]);
    savePatterns(); renderTaxonomy();
  };
  page.querySelectorAll('[data-save-mode]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.saveMode), m = modes[i];
    const form = page.querySelector(`.mode-form[data-mode="${i}"]`);
    const next = {};
    form.querySelectorAll('[data-k]').forEach(el => { next[el.dataset.k] = el.value.trim(); });
    next.positives = next.positives ? next.positives.split(/[\s,]+/) : [];
    next.close_negatives = next.close_negatives ? next.close_negatives.split(/[\s,]+/) : [];
    const unknown = [...next.positives, ...next.close_negatives].filter(t => !S.traceIndex[t]);
    if (unknown.length) return toast('Unknown trace ids: ' + unknown.slice(0, 3).join(', '));
    if (!/^[a-z][a-z0-9_]{1,63}$/.test(next.name)) return toast('Name must be snake_case.');
    const revnote = next._revnote; delete next._revnote;
    const changes = {};
    Object.keys(next).forEach(k => { if (JSON.stringify(m[k] || (Array.isArray(next[k]) ? [] : '')) !== JSON.stringify(next[k])) changes[k] = {from: m[k] || null, to: next[k]}; });
    if (!Object.keys(changes).length) return toast('No changes.');
    if (changes.name && Object.values(S.labels[m.name] || {}).length) {
      if (!confirm('Labels already exist under the old name. Renaming starts a new label file; the old judgments stay under the old name. Continue?')) return;
    }
    Object.assign(m, next);
    m.revisions = (m.revisions || []).concat([{at: nowIso(), note: revnote, changes}]);
    savePatterns(); toast('mode saved'); renderTaxonomy();
  });
  page.querySelectorAll('[data-assign]').forEach(cb => cb.onchange = () => {
    const m = modes.find(x => x.name === cb.dataset.modeName); if (!m) return;
    m.annotation_ids = (m.annotation_ids || []).filter(id => id !== cb.dataset.assign);
    if (cb.checked) m.annotation_ids.push(cb.dataset.assign);
    savePatterns(); renderTaxonomy();
  });
}

async function setLabel(mode, tid, label) {
  const ev = $('lab-evidence');
  const evidence = ev && S.labelSel && S.labelSel.mode === mode && S.labelSel.trace_id === tid ? ev.value.trim() : '';
  const cur = (S.labels[mode] || {})[tid];
  if (cur && cur.label === label && (cur.evidence || '') === evidence) return;
  try {
    const res = await api.post('/api/labels', {mode, trace_id: tid, label, evidence, source: 'human', session_id: sessionOf(tid)});
    S.labels = await api.get('/api/labels');
    const sync = res.sync;
    toast(`${mode}: ${label ? 'present' : 'absent'} saved locally` + (sync ? (sync.error ? ' · Langfuse pending' : ' · sent to Langfuse') : ''));
  } catch (e) { toast('Label not saved: ' + e.message); }
  renderLabels();

/* ------------------------------------------------------------------ *

let lastSync = null;
function renderProgress() {
  const items = S.manifest.items || [];
  const batches = S.manifest.batches || {};
  const seen = {}; const dupes = new Set();
  items.forEach(it => { if (seen[it.trace_id]) dupes.add(it.trace_id); seen[it.trace_id] = true; });
  const distinct = Object.keys(seen);
  const reviewed = distinct.filter(t => traceStatus(t) === 'done');
  const unreviewed = distinct.filter(t => traceStatus(t) !== 'done');
  const modes = modesFor(false);
  const missing = distinct.map(t => ({t, m: modes.filter(m => !(S.labels[m.name] || {})[t]).map(m => m.name)})).filter(x => x.m.length);
  const allLabels = Object.entries(S.labels).flatMap(([m, recs]) => Object.values(recs));
  const syncCount = k => allLabels.filter(r => r.sync === k).length;
  const rowLink = t => { const hit = S.traceIndex[t]; return `<a class="link" data-goto="${t}">${hit ? esc(hit.session.scenario_id || '') + ' t' + hit.turn.turn : short(t)}</a>`; };
  const decided = S.suggestions.filter(x => x.status !== 'pending');
  $('progress-page').innerHTML = `<h2>Progress</h2>
    <div class="card"><table><thead><tr><th>Batch</th><th>Method</th><th>Sampled</th><th>Reviewed</th><th></th></tr></thead><tbody>
    ${Object.entries(batches).map(([b, info]) => { const its = items.filter(i => i.batch === b); const r = its.filter(i => traceStatus(i.trace_id) === 'done').length;
      return `<tr><td>${esc(b)}</td><td class="small muted">${esc(info.method || '')}${info.field ? ' · ' + esc(info.field) : ''}</td><td>${its.length}/${info.target}</td><td>${r}/${its.length}</td><td><div class="bar"><span style="width:${its.length ? 100 * r / its.length : 0}%"></span></div></td></tr>`; }).join('')}
    <tr><td><b>Total distinct</b></td><td></td><td><b>${distinct.length}</b>/100</td><td><b>${reviewed.length}</b>/${distinct.length}</td><td><div class="bar"><span style="width:${Math.min(100, reviewed.length)}%"></span></div></td></tr>
    </tbody></table>
    ${dupes.size ? `<div class="chip warn">${dupes.size} trace(s) appear in more than one batch</div>` : ''}
    ${!items.length ? '<p class="muted small">No sample yet. Run <code>uv run python -m analysis.review_app.sample uniform --batch initial_uniform --n 15</code> and reload.</p>' : ''}</div>

    <h3>Needs review (${unreviewed.length})</h3>
    <div class="card small">${unreviewed.map(t => `${rowLink(t)} <span class="muted">${traceStatus(t) === 'part' ? '(notes, no first failure or no-failure mark)' : ''}</span>`).join(' · ') || '<span class="muted">Nothing outstanding.</span>'}</div>

    <h3>Incomplete judgments (${missing.length} traces)</h3>
    <div class="card small">${!modes.length ? '<span class="muted">No final modes yet.</span>' : missing.map(x => `${rowLink(x.t)} <span class="muted">missing ${esc(x.m.join(', '))}</span>`).join('<br>') || 'Every sampled trace has a judgment for every final mode.'}</div>

    <h3>Modes in the reviewed sample</h3>
    <div class="card"><table><thead><tr><th>Mode</th><th>Present</th><th>Absent</th><th>Sample fraction</th><th>Positives listed (≥3)</th><th>Close negatives listed (≥3)</th></tr></thead><tbody>
    ${(S.patterns.modes || []).filter(m => m.status !== 'rejected').map(m => { const recs = Object.values(S.labels[m.name] || {}); const p = recs.filter(r => r.label === 1).length, n = recs.filter(r => r.label === 0).length;
      return `<tr><td>${esc(m.name)} <span class="muted small">${esc(m.status)}</span></td><td>${p}</td><td>${n}</td><td>${p + n ? (100 * p / (p + n)).toFixed(0) + '% of ' + (p + n) : '—'}</td>
        <td>${(m.positives || []).length}</td><td>${(m.close_negatives || []).length}</td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">No modes yet.</td></tr>'}
    </tbody></table><p class="small muted">Sample fractions, not prevalence: the batches deliberately over-sample some kinds of trace.</p></div>

    <h3>Langfuse sync</h3>
    <div class="card">${allLabels.length} judgments · ${syncCount('verified')} verified · ${syncCount('sent')} sent · ${syncCount('pending')} pending
      <button id="sync-now" style="margin-left:8px">Sync now</button>
      ${lastSync && lastSync.error ? `<div class="chip warn" style="margin-top:6px">${esc(lastSync.error)}</div>` : ''}
      <p class="small muted">Local label files under analysis/state/labels/ are written first. A judgment is verified once its score is read back from Langfuse with the same value.</p></div>

    <h3>Suggestion decisions</h3>
    <div class="card small">${decided.filter(x => x.status === 'accepted').length} accepted · ${decided.filter(x => x.status === 'rejected').length} rejected · ${S.suggestions.filter(x => x.status === 'pending').length} pending</div>`;
  $('progress-page').querySelectorAll('[data-goto]').forEach(a => a.onclick = () => gotoTrace(a.dataset.goto));
  $('sync-now').onclick = async () => {
    $('sync-now').disabled = true;
    try { lastSync = (await api.post('/api/sync', {})).sync; S.labels = await api.get('/api/labels');
      toast(lastSync.error ? 'Langfuse unavailable; judgments stay pending' : `sent ${lastSync.sent}, verified ${lastSync.verified}`);
    } catch (e) { toast('Sync failed: ' + e.message); }
    renderProgress();
  };
}

/* ------------------------------------------------------------------ *
 * shell                                                                *
 * ------------------------------------------------------------------ */
function renderSource() {
  const m = S.meta, el = $('source');
  const fallback = m.source && m.source !== 'langfuse';
  el.className = fallback ? 'fallback' : '';
  el.textContent = `source: ${m.source}`;
  el.title = `${m.session_count} sessions · ${m.trace_count} traces · source: ${m.source}\nloaded ${m.loaded_at || ''}; session ids: ${JSON.stringify(m.session_sources || {})}`;
}
function switchView(v) {
  S.view = v;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  document.querySelectorAll('.view').forEach(el => el.classList.toggle('on', el.id === 'view-' + v));
  renderView();
}
function renderView() {
  if (S.view === 'review') { renderSessionList(); renderSession(); }
  else if (S.view === 'taxonomy') renderTaxonomy();
  else if (S.view === 'labels') renderLabels();
  else if (S.view === 'progress') renderProgress();
  else if (S.view === 'suggestions') renderSuggestions();
}
/* Live review count for the sampled traces, shown in the top bar. */
function reviewCounts(tids) {
  const c = {total: tids.length, done: 0, failure: 0, nofail: 0, part: 0, open: 0};
  tids.forEach(t => {
    const anns = S.annotations.filter(a => a.trace_id === t);
    if (anns.some(a => a.kind === 'no_failure')) { c.done++; c.nofail++; }
    else if (anns.some(a => a.first_failure)) { c.done++; c.failure++; }
    else if (anns.length) c.part++;
    else c.open++;
  });
  return c;
}
function renderCounter() {
  const el = $('counter');
  const items = S.manifest.items || [];
  const tids = [...new Set(items.map(i => i.trace_id))];
  if (!tids.length) { el.style.display = 'none'; return; }
  el.style.display = '';
  const c = reviewCounts(tids);
  const pct = Math.round(100 * c.done / c.total);
  el.innerHTML = `<span><b>${c.done}</b>/${c.total} reviewed</span>
    <span class="bar"><span style="width:${pct}%"></span></span>
    <span class="k" title="first failure marked"><span class="dot" style="background:var(--bad)"></span>${c.failure} failure</span>
    <span class="k" title="no failure observed"><span class="dot done"></span>${c.nofail} no failure</span>
    ${c.part ? `<span class="k" title="notes written but no first-failure or no-failure mark yet"><span class="dot part"></span>${c.part} unmarked</span>` : ''}
    <span class="k" title="not opened yet"><span class="dot"></span>${c.open} to do</span>`;
  const batches = Object.keys(S.manifest.batches || {}).filter(b => items.some(i => i.batch === b));
  el.title = batches.map(b => {
    const bc = reviewCounts([...new Set(items.filter(i => i.batch === b).map(i => i.trace_id))]);
    return `${b}: ${bc.done}/${bc.total} reviewed (${bc.failure} failure, ${bc.nofail} no failure, ${bc.part} notes only)`;
  }).join('\n') + '\n\nClick to open the Progress tab.';
}
$('counter').onclick = () => switchView('progress');

function renderAll() { renderCounter(); renderSource(); renderBatchFilter(); $('sugg-count').textContent = S.suggestions.filter(x => x.status === 'pending').length; renderView(); }
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => switchView(b.dataset.view));
['f-search', 'f-scope', 'f-role', 'f-batch', 'f-status'].forEach(id => $(id).addEventListener('input', renderSessionList));
document.addEventListener('keydown', e => {
  if (S.view !== 'review' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || pending) return;
  if (e.key !== 'j' && e.key !== 'k') return;
  const list = filteredSessions(); const i = list.findIndex(s => s.session_id === S.sid);
  const next = list[Math.max(0, Math.min(list.length - 1, i + (e.key === 'j' ? 1 : -1)))];
  if (next) openSession(next.session_id);
});

/* Poll for files the coding agent writes: suggestions, taxonomy, sample. */
async function poll() {
  if (pending || S.editing || document.activeElement.closest('#taxonomy-page')) return;
  try {
    const [manifest, patterns, sugg] = await Promise.all([api.get('/api/manifest'), api.get('/api/patterns'), api.get('/api/suggestions')]);
    let changed = false;
    if (JSON.stringify(manifest) !== S.serverSnap.manifest) { S.manifest = manifest; S.serverSnap.manifest = JSON.stringify(manifest); reindex(); changed = true; toast('sample updated'); }
    if (JSON.stringify(patterns) !== S.serverSnap.patterns) { S.patterns = patterns.modes ? patterns : {modes: []}; S.serverSnap.patterns = JSON.stringify(patterns); changed = true; }
    if (JSON.stringify(sugg) !== S.serverSnap.suggestions) {
      const before = S.suggestions.filter(x => x.status === 'pending').length;
      S.suggestions = Array.isArray(sugg) ? sugg : []; S.serverSnap.suggestions = JSON.stringify(sugg); changed = true;
      const after = S.suggestions.filter(x => x.status === 'pending').length;
      if (after > before) toast(`${after - before} new AI suggestion${after - before > 1 ? 's' : ''}`);
    }
    if (changed) renderAll();
  } catch (e) { /* server restarting */ }
}

(async function boot() {
  try { await loadAll(); }
  catch (e) { $('content').innerHTML = `<div class="empty">Could not load traces: ${esc(e.message)}</div>`; return; }
  if (!Object.keys(S.sampleIndex).length) $('f-scope').value = 'all';
  renderAll();
  const hash = new URLSearchParams(location.hash.slice(1));
  const first = filteredSessions()[0];
  if (hash.get('s') && S.sessionIndex[hash.get('s')]) openSession(hash.get('s'), hash.get('t'));
  else if (first) openSession(first.session_id);
  setInterval(poll, 3000);
  window.addEventListener('hashchange', () => {
    const h = new URLSearchParams(location.hash.slice(1));
    const sid = h.get('s');
    if (sid && S.sessionIndex[sid] && (sid !== S.sid || h.get('t') !== S.tid)) openSession(sid, h.get('t'));
  });
})();
</script>
